name: Publish package to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/vorb-ui/package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Verify package
        run: |
          bun run lint
          bun run --cwd packages/vorb-ui typecheck
          bun run --cwd packages/vorb-ui test
          bun run --cwd packages/vorb-ui build
          bun run --cwd packages/vorb-ui typecheck:package
          bun run --cwd packages/vorb-ui test:package

      - name: Publish package
        working-directory: packages/vorb-ui
        run: npm publish --access public
